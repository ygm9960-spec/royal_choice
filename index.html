  <style>
    :root{--bg:#09111d;--panel:#111c2b;--panel2:#162438;--gold:#d7b66a;--gold2:#f0d99b;--text:#f3f0e9;--muted:#aeb9c8;--line:#2b3b53;--paper:#f5efe2;--ink:#2d2923;--danger:#bc6d6d;--ok:#78a98a;--shadow:0 20px 50px rgba(0,0,0,.28)}

    main{width:min(720px,100%);margin:0 auto;padding:24px 16px 110px}.hero{padding:28px 4px 18px}.eyebrow{font-size:12px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}.hero h1,.card h1,.card h2{font-family:serif;margin:.35em 0}.hero h1{font-size:34px;line-height:1.2}.hero p{color:var(--muted);line-height:1.7}
    .card{background:linear-gradient(180deg,rgba(23,36,55,.98),rgba(15,25,39,.98));border:1px solid rgba(215,182,106,.16);border-radius:22px;padding:22px;box-shadow:var(--shadow);animation:rise .25s ease}.card.paper{background:var(--paper);color:var(--ink);border-color:#d9ccb1}.card.paper .muted{color:#6a645b}.card + .card{margin-top:14px}@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

    .quote{font-family:serif;font-size:19px;line-height:1.85;word-break:keep-all}.muted{color:var(--muted)}.small{font-size:13px;line-height:1.6}.divider{height:1px;background:var(--line);margin:18px 0}.label{font-size:13px;color:var(--gold2);font-weight:700;margin-bottom:8px}.field{width:100%;border:1px solid var(--line);border-radius:14px;background:#0b1421;color:var(--text);padding:14px 15px;outline:none}.field:focus{border-color:#8a7440;box-shadow:0 0 0 3px rgba(215,182,106,.08)}textarea.field{min-height:140px;resize:vertical;line-height:1.65}.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.login-grid .full{grid-column:1/-1}

    .teacher-hotspot{position:fixed;right:4px;bottom:max(4px,env(safe-area-inset-bottom));z-index:70;width:22px;height:22px;padding:0;border:0;border-radius:7px;background:rgba(215,182,106,.015);opacity:.08;box-shadow:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.teacher-hotspot:focus{outline:none}.teacher-hotspot::after{content:"";position:absolute;right:4px;bottom:4px;width:3px;height:3px;border-radius:50%;background:rgba(215,182,106,.24)}
    @media(max-width:520px){main{padding-top:14px}.hero h1{font-size:29px}.quote{font-size:17px}.compare{grid-template-columns:1fr}.score-grid{grid-template-columns:1fr 1fr}.student-chip{display:none}}

.decision-header{text-align:center;padding:19px 0 13px}.decision-orb{width:54px;height:54px;margin:0 auto 12px;display:grid;place-items:center;border:1px solid rgba(217,184,111,.3);border-radius:50%;font-family:serif;color:#e1c57f;background:radial-gradient(circle,rgba(217,184,111,.12),transparent 70%)}
.choices{gap:9px}.choice{position:relative;padding:14px 15px 14px 52px;border-radius:15px;background:linear-gradient(180deg,rgba(19,31,47,.92),rgba(11,20,31,.95));border-color:rgba(255,255,255,.075);min-height:68px}.choice::before{content:attr(data-key);position:absolute;left:14px;top:14px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1px solid #425068;color:#aeb8c6;font-size:11px;font-weight:900}.choice strong{font-family:"Noto Serif KR",serif;font-size:15px;color:#f1eee7}.choice span{font-size:12px;line-height:1.48;margin-top:3px}.choice.selected{border-color:#d0ad61;background:linear-gradient(180deg,rgba(57,48,32,.96),rgba(25,26,27,.98));box-shadow:0 0 0 1px rgba(208,173,97,.15),0 12px 30px rgba(0,0,0,.23)}.choice.selected::before{background:#c9a45d;color:#171108;border-color:#e3c77e}.choice:active{transform:scale(.99)}

function initBackend(){
  const iframe=document.getElementById('gasBackend');
  const url=String(CONFIG.appsScriptUrl||'').trim();
  window.addEventListener('message', onBackendMessage);
  if(!url || url.includes('PASTE_APPS_SCRIPT')){
    backend.lastError='config.js에 Apps Script /exec 주소가 입력되지 않았습니다.';
    setSave('error','서버 주소 미설정');
    return;
  }
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/.test(url)){
    backend.lastError='Apps Script 웹 앱의 /exec 주소 형식이 아닙니다.';
    setSave('error','서버 주소 오류');
    return;
  }
  iframe.src=url;
  const ping=()=>{try{iframe.contentWindow&&iframe.contentWindow.postMessage({type:'RC_PING'},'*')}catch(e){}};
  iframe.addEventListener('load',ping);
  backend.pingTimer=setInterval(ping,700);
  backend.timer=setTimeout(()=>{if(!backend.ready){backend.lastError='Apps Script 응답이 없습니다. 웹 앱 배포 권한과 /exec 주소를 확인하세요.';setSave('error','서버 연결 실패')}},12000);
}
function onBackendMessage(event){
  const frame=document.getElementById('gasBackend');
  if(!frame || event.source!==frame.contentWindow) return;
  const data=event.data||{};
  if(data.type==='RC_BACKEND_DENIED'||(data.type==='RC_BACKEND_READY'&&data.allowed===false)){
    backend.lastError=`Apps Script의 ALLOWED_ORIGIN에 ${location.origin} 을(를) 등록하세요.`;
    clearInterval(backend.pingTimer);clearTimeout(backend.timer);setSave('error','접속 주소 불일치');
    return;
  }
  if(data.type==='RC_BACKEND_READY'){
    backend.ready=true;backend.lastError='';clearInterval(backend.pingTimer);clearTimeout(backend.timer);setSave('saved',student?'서버 연결':'연결 준비');
    if(student&&token)syncNow();
    return;
  }
  if(data.type!=='RC_RESULT'||!data.id)return;
  const p=backend.pending.get(data.id);if(!p)return;
  backend.pending.delete(data.id);clearTimeout(p.timer);
  data.ok?p.resolve(data.value):p.reject(new Error(data.error||'서버 처리 중 오류가 발생했습니다.'));
}
function server(method,...args){
  const url=String(CONFIG.appsScriptUrl||'').trim();
  if(!url || url.includes('PASTE_APPS_SCRIPT')) return Promise.reject(new Error('Apps Script 배포 URL이 설정되지 않았습니다. config.js를 확인하세요.'));
  if(!backend.ready) return Promise.reject(new Error(backend.lastError||'저장 서버에 연결하는 중입니다. 잠시 후 다시 시도하세요.'));
  return new Promise((resolve,reject)=>{
    const id='rc-'+Date.now()+'-'+(++backend.seq);
    const timer=setTimeout(()=>{backend.pending.delete(id);reject(new Error('서버 응답이 지연되고 있습니다. 인터넷 연결을 확인하세요.'));},15000);
    backend.pending.set(id,{resolve,reject,timer});
    document.getElementById('gasBackend').contentWindow.postMessage({type:'RC_CALL',id,method,args},'*');
  });
}

  const raw=document.getElementById('bulkStudents').value.trim();if(!raw)return;
  const rows=raw.split(/\n+/).map(line=>{const [classNo,number,...nameParts]=line.split(',');return{classNo:(classNo||'').trim(),number:(number||'').trim(),name:nameParts.join(',').trim()}});
  try{const r=await server('teacherBulkUpsertStudents',teacherToken,rows);alert(`${r.count}명 명단을 등록했습니다.`);renderTeacherDash()}catch(e){alert(e.message)}
}
async function approveRegistration(requestId){
  if(!confirm('이 학생의 최초 등록 요청을 승인할까요? 승인 후 학생이 직접 비밀번호를 설정합니다.'))return;
  try{await server('teacherApproveRegistration',teacherToken,requestId);alert('승인했습니다. 학생에게 승인 확인을 누르라고 안내하세요.');renderTeacherDash()}catch(e){alert(e.message)}
}
async function resetStudentPw(id){
  if(!confirm('이 학생의 비밀번호를 초기화할까요? 기존 비밀번호와 로그인 세션이 무효화됩니다.'))return;
  try{await server('teacherResetStudentPassword',teacherToken,id);alert('초기화했습니다. 학생이 본인 기기에서 처음 등록 → 승인 확인으로 새 비밀번호를 설정할 수 있습니다.');renderTeacherDash()}catch(e){alert(e.message)}
}

async function allowResubmit(id){if(!confirm('이 학생의 기존 제출을 취소하고 재제출을 허용할까요? 기존 채점 결과도 초기화됩니다.'))return;try{await server('teacherAllowResubmit',teacherToken,id);alert('재제출을 허용했습니다. 학생이 다시 로그인하면 답안을 수정·제출할 수 있습니다.');renderTeacherDash()}catch(e){alert(e.message)}}
async function openStudentAdmin(id){const panel=document.getElementById('teacherPanel');panel.innerHTML='<div>불러오는 중…</div>';try{const r=await server('teacherGetStudentRecord',teacherToken,id);const st=safeJson(r.stateJson,{});panel.innerHTML=`<div class="eyebrow">학생 기록</div><h2>${esc(r.student.classNo)}반 ${esc(r.student.number)}번 ${esc(r.student.name)}</h2><div class="small muted">제출: ${esc(r.submittedAt||'미제출')}</div><div class="divider"></div>${STORY.chapters.map(ch=>{const x=st.decisions?.[ch.id];if(!x)return '';return `<details><summary>${esc(ch.title)}</summary><div class="summary-row"><b>정책</b>${esc(policyLabel(ch,x.policyId))}</div><div class="summary-row"><b>이유</b>${esc(x.reason)}</div><div class="summary-row"><b>예상</b>${esc(x.prediction)}</div>${(x.perspectives||[]).map(p=>`<div class="summary-row"><b>${esc(perspectiveLabel(p.id))}</b>${esc(p.text)}</div>`).join('')}</details>`}).join('')}<div class="divider"></div><h3>최종 답안</h3>${(st.finalAnswers||[]).map((a,i)=>`<div class="summary-row"><b>${esc(STORY.finalQuestions[i]?.title||'')}</b><div>${esc(a)}</div></div>`).join('')}<div class="divider"></div><h3>채점</h3><div class="score-grid">${['situation','logic','perspectives','judgment'].map((k,i)=>`<label class="small">${i+1}번<select class="field" id="g_${k}"><option value="25">25</option><option value="20">20</option><option value="15">15</option></select></label>`).join('')}</div><textarea class="field" id="g_comment" placeholder="교사 의견" style="min-height:80px;margin-top:10px"></textarea><div class="admin-actions" style="margin-top:12px"><button class="mini" onclick="saveGrade('${id}')">채점 저장</button>${r.submittedAt?`<button class="mini" onclick="allowResubmit('${id}')">재제출 허용</button>`:''}<button class="mini" onclick="renderTeacherDash()">목록</button></div>`;const g=r.grade||{};['situation','logic','perspectives','judgment'].forEach(k=>{const el=document.getElementById('g_'+k);if(g[k])el.value=String(g[k])});document.getElementById('g_comment').value=g.comment||''}catch(e){panel.innerHTML='<div class="error">'+esc(e.message)+'</div><button class="mini" onclick="renderTeacherDash()">목록</button>'}}
async function saveGrade(id){const grade={situation:+document.getElementById('g_situation').value,logic:+document.getElementById('g_logic').value,perspectives:+document.getElementById('g_perspectives').value,judgment:+document.getElementById('g_judgment').value,comment:document.getElementById('g_comment').value};try{const r=await server('teacherSaveGrade',teacherToken,id,grade);alert('저장했습니다. 총점 '+r.total+'점');renderTeacherDash()}catch(e){alert(e.message)}}

document.getElementById('teacherModal').addEventListener('click',e=>{if(e.target.id==='teacherModal')closeTeacher()});
document.getElementById('audioBtn').addEventListener('click',toggleAudio);updateAudioButton();

// boot
(function boot(){if(student){const local=readLocalState(student.studentId);if(local)state=local}setStudentUI();render();initBackend()})();
</script>
</body>
</html>
